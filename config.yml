engine:
  speed: 4
  autoclose: False
recorder:
  file: record/test.pickle
  record:
    - trailmarker
    - preprocessor
    - hiddenmarkov
    - detector
  replay:
    - trailmarker
    - preprocessor
    - hiddenmarkov
    - detector
webcam:
  deviceIndex: 0
  width: 640
  height: 360
  dtype: u8
  flip: True
preprocessor:
  finger_idx: 8
  min_speed_corner: 0.02
  reset_speed_corner: 0.024
  buffer_size: 140
  max_lost: 10
  min_steps: 15
  max_jump: 0.10   # Punkte mit groesserem Sprung verwerfen (Detektor-Ausreisser)
  min_move: 0.002  # Punkte ohne Bewegung verwerfen (Stillstands-Jitter)