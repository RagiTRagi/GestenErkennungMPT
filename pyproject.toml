[project]
name = "gesturerecognition"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hmmlearn>=0.3.3",
    "mediapipe>=0.10.32",
    "optuna>=4.9.0",
    "signalhub",
    "tqdm>=4.67.3",
]

[project.scripts]
main = "main:main"
hmm-train = "GestureRecognition.hmmclassifier:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["GestureRecognition*"]

[tool.uv.sources]
signalhub = { git = "https://github.com/jaboll-ai/SignalHub.git", rev = "pyproject" }

[dependency-groups]
dev = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.uv]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
